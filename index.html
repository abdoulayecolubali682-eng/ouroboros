<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ouroboros</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #120d18;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .application {
      width: 390px;
      min-height: 750px;
      padding: 25px 20px;
      border-radius: 30px;
      background: linear-gradient(#3a1d50, #18101f);
      box-shadow: 0 0 30px #000;
    }

    header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 22px;
    }

    .bonjour {
      margin-top: 45px;
      color: #d0bfd4;
    }

    h1 {
      font-size: 29px;
      margin-top: 8px;
    }

    .coach {
      width: 150px;
      height: 220px;
      margin: 60px auto 35px;
      border-radius: 80px 80px 35px 35px;
      background: linear-gradient(160deg, #ed4f91, #7b3fc6, #c96527);
      box-shadow: 0 0 45px #ed4f91aa;
      position: relative;
    }

    .tete {
      position: absolute;
      width: 90px;
      height: 90px;
      top: -42px;
      left: 30px;
      border-radius: 50%;
      background: #9f5bd4;
    }

    .yeux {
      position: absolute;
      top: 42px;
      left: 25px;
      width: 40px;
      height: 8px;
      border-left: 8px solid white;
      border-right: 8px solid white;
    }

    .sourire {
      position: absolute;
      left: 32px;
      top: 60px;
      width: 25px;
      height: 10px;
      border-bottom: 3px solid white;
      border-radius: 50%;
    }

    .serie,
    .programme {
      padding: 18px;
      margin-top: 15px;
      border-radius: 20px;
      background: #2a1a31;
    }

    .serie {
      font-size: 23px;
      font-weight: bold;
    }

    .petit {
      display: block;
      margin-top: 5px;
      color: #c8b9c9;
      font-size: 14px;
      font-weight: normal;
    }

    .programme strong {
      display: block;
      margin-top: 8px;
      font-size: 20px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 17px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(90deg, #c96527, #ed4f91);
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    nav {
      display: flex;
      justify-content: space-around;
      margin-top: 28px;
      color: #c8b9c9;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="application">
    <header>
      <span>OUROBOROS</span>
      <span>☰</span>
    </header>

    <div class="bonjour">Bonjour, champion·ne</div>

    <h1>Prêt à faire grandir ta flamme ?</h1>

    <div class="coach">
      <div class="tete">
        <div class="yeux"></div>
        <div class="sourire"></div>
      </div>
    </div>

    <div class="serie">
      🔥 7 jours
      <span class="petit">Ta série actuelle</span>
    </div>

    <div class="programme">
      PROGRAMME DU JOUR
      <strong>Full body — niveau débutant</strong>
      <button onclick="alert('Ta séance va commencer !')">
        Commencer ma séance
      </button>
    </div>

    <nav>
      <span>Accueil</span>
      <span>Programme</span>
      <span>Coach</span>
      <span>Profil</span>
    </nav>
  </main>
</body>
</html>
